# @package _global_
# ============================================================================
# SAM3 Evaluation Configuration for Solar Array Segmentation Dataset
# SageMaker-compatible version
#
# Usage:
#   python sam3/train/eval_sam3_sagemaker_seg.py --config sam3/train/configs/solar_array/solar_array_seg_eval_sagemaker.yaml
# ============================================================================

defaults:
  - _self_

# ============================================================================
# SageMaker Configuration - S3 Data URIs
# ============================================================================
sagemaker:
  # S3 URI for validation/test data (should contain images/ and _annotations.coco.json)
  val_data_uri: s3://zeitview-aiml-research-artifacts/solar/ir_hotspot_and_diode_failure_detection_v1/datasets/solar_array_mini_v0/test/

  # S3 URI to the fine-tuned checkpoint to evaluate
  # This should point to the best checkpoint from training, e.g.:
  #   s3://zeitview-aiml-research-artifacts/solar/.../artifacts/checkpoints/detection_segm_AP_0.50_0.95.pt
  #pretrained_checkpoint_uri: null  # REQUIRED — set this to your trained checkpoint S3 URI
  pretrained_checkpoint_uri: s3://zeitview-aiml-research-artifacts/solar/ir_hotspot_and_diode_failure_detection_v1/datasets/solar_array_mini_v0/artifacts_3/checkpoints/checkpoint_30.pt  # REQUIRED — set this to your trained checkpoint S3 URI

  # S3 URI where evaluation outputs (metrics, predictions) will be uploaded
  output_uri: s3://zeitview-aiml-research-artifacts/solar/ir_hotspot_and_diode_failure_detection_v1/sam3_test/eval_results_3/

  # S3 URI for BPE tokenizer file
  bpe_s3_uri: s3://zeitview-aiml-research-artifacts/solar/ir_hotspot_and_diode_failure_detection_v1/datasets/solar_array_mini_v0/bpe_simple_vocab_16e6.txt.gz

# ============================================================================
# WandB (Weights & Biases) Configuration
# ============================================================================
wandb:
  enabled: true
  project: sam3-solar-array-segmentation
  entity: zeitview
  run_name: null  # e.g., "solar_array_seg_eval_v1"
  tags:
    - sam3
    - sagemaker
    - solar-array
    - segmentation
    - evaluation
  notes: "SAM3 evaluation for solar array segmentation on test set"

# ============================================================================
# Paths Configuration - Local paths on SageMaker instance
# ============================================================================
paths:
  # Root directory where test data will be downloaded to on SageMaker
  dataset_root: /tmp/solar_array_data

  # Directory where evaluation logs and prediction dumps will be saved
  experiment_log_dir: /tmp/experiments/solar_array_segmentation_eval

  # BPE tokenizer path (included in the codebase)
  bpe_path: sam3/assets/bpe_simple_vocab_16e6.txt.gz

  # Checkpoint path — will be overridden by the SageMaker script after S3 download
  checkpoint_path: null

# ============================================================================
# Dataset Configuration (eval-only — no training transforms needed)
# ============================================================================
solar_train:
  # Validation transforms pipeline
  val_transforms:
    - _target_: sam3.train.transforms.basic_for_api.ComposeAPI
      transforms:
        - _target_: sam3.train.transforms.segmentation.DecodeRle
        - _target_: sam3.train.transforms.basic_for_api.RandomResizeAPI
          sizes: ${scratch.resolution}
          max_size:
            _target_: sam3.train.transforms.basic.get_random_resize_max_size
            size: ${scratch.resolution}
          square: true
          consistent_transform: False
        - _target_: sam3.train.transforms.basic_for_api.ToTensorAPI
        - _target_: sam3.train.transforms.basic_for_api.NormalizeAPI
          mean: ${scratch.val_norm_mean}
          std: ${scratch.val_norm_std}

# ============================================================================
# Scratch (Helper Parameters)
# ============================================================================
scratch:
  enable_segmentation: True

  # Model parameters
  d_model: 256
  pos_embed:
    _target_: sam3.model.position_encoding.PositionEmbeddingSine
    num_pos_feats: ${scratch.d_model}
    normalize: true
    scale: null
    temperature: 10000

  # Box processing
  use_presence_eval: True
  original_box_postprocessor:
    _target_: sam3.eval.postprocessors.PostProcessImage
    max_dets_per_img: -1
    use_original_ids: true
    use_original_sizes_box: true
    use_presence: ${scratch.use_presence_eval}

  mask_postprocessor:
    _target_: sam3.eval.postprocessors.PostProcessImage
    max_dets_per_img: -1
    iou_type: "segm"
    use_original_ids: true
    use_original_sizes_box: true
    use_original_sizes_mask: true
    convert_mask_to_rle: True
    detection_threshold: 0.3  # No filtering — let COCO eval handle all predictions
    use_presence: ${scratch.use_presence_eval}

  # Image processing parameters
  resolution: 1008
  max_ann_per_img: 200

  # Normalization parameters
  val_norm_mean: [0.5, 0.5, 0.5]
  val_norm_std: [0.5, 0.5, 0.5]
  # Keep train_norm for compatibility with shared transform references
  train_norm_mean: [0.5, 0.5, 0.5]
  train_norm_std: [0.5, 0.5, 0.5]

  # Worker / batch parameters
  num_val_workers: 4
  val_batch_size: 1

  # These are unused for eval but required by Hydra interpolation
  num_train_workers: 0
  train_batch_size: 1
  max_data_epochs: 1
  target_epoch_size: 1500
  hybrid_repeats: 1
  context_length: 2
  gather_pred_via_filesys: false

  # Learning rate params (unused for eval, kept for schema compatibility)
  lr_scale: 0.1
  lr_transformer: ${times:8e-4,${scratch.lr_scale}}
  lr_vision_backbone: ${times:2.5e-4,${scratch.lr_scale}}
  lr_language_backbone: ${times:5e-5,${scratch.lr_scale}}
  lrd_vision_backbone: 0.9
  wd: 0.1
  scheduler_timescale: 20
  scheduler_warmup: 20
  scheduler_cooldown: 20

  collate_fn_val:
    _target_: sam3.train.data.collator.collate_fn_api
    _partial_: true
    repeats: ${scratch.hybrid_repeats}
    dict_key: solar_array
    with_seg_masks: ${scratch.enable_segmentation}

# ============================================================================
# Trainer Configuration — EVALUATION MODE
# ============================================================================
trainer:
  _target_: sam3.train.trainer.Trainer
  skip_saving_ckpts: true
  empty_gpu_mem_cache_after_eval: True
  skip_first_val: True
  max_epochs: ${scratch.max_data_epochs}
  accelerator: cuda
  seed_value: 42
  val_epoch_freq: 1
  mode: val  # <<< EVALUATION MODE

  distributed:
    backend: nccl
    find_unused_parameters: True
    gradient_as_bucket_view: True

  # No loss needed for evaluation
  loss:
    all:
      _target_: sam3.train.loss.sam3_loss.DummyLoss
    default:
      _target_: sam3.train.loss.sam3_loss.DummyLoss

  data:
    train: null  # No training data for evaluation
    val:
      _target_: sam3.train.data.torch_dataset.TorchDataset
      dataset:
        _target_: sam3.train.data.sam3_image_dataset.Sam3ImageDataset
        load_segmentation: ${scratch.enable_segmentation}
        coco_json_loader:
          _target_: sam3.train.data.coco_json_loaders.COCO_FROM_JSON
          include_negatives: true
          category_chunk_size: 2
          _partial_: true
        img_folder: ${paths.dataset_root}/test/
        ann_file: ${paths.dataset_root}/test/_annotations.coco.json
        transforms: ${solar_train.val_transforms}
        max_ann_per_img: 100000
        multiplier: 1
        training: false

      shuffle: False
      batch_size: ${scratch.val_batch_size}
      num_workers: ${scratch.num_val_workers}
      pin_memory: True
      drop_last: False
      collate_fn: ${scratch.collate_fn_val}

  model:
    _target_: sam3.model_builder.build_sam3_image_model
    bpe_path: ${paths.bpe_path}
    device: cpu
    eval_mode: true
    enable_segmentation: ${scratch.enable_segmentation}
    checkpoint_path: ${paths.checkpoint_path}

  meters:
    val:
      solar_array:
        detection_bbox:
          _target_: sam3.eval.coco_writer.PredictionDumper
          iou_type: "bbox"
          dump_dir: ${launcher.experiment_log_dir}/dumps/solar_array_bbox
          merge_predictions: True
          postprocessor: ${scratch.original_box_postprocessor}
          gather_pred_via_filesys: ${scratch.gather_pred_via_filesys}
          maxdets: 100
          pred_file_evaluators:
            - _target_: sam3.eval.coco_eval_offline.CocoEvaluatorOfflineWithPredFileEvaluators
              gt_path: ${paths.dataset_root}/test/_annotations.coco.json
              tide: False
              iou_type: "bbox"
        detection_segm:
          _target_: sam3.eval.coco_writer.PredictionDumper
          iou_type: "segm"
          dump_dir: ${launcher.experiment_log_dir}/dumps/solar_array_segm
          merge_predictions: True
          postprocessor: ${scratch.mask_postprocessor}
          gather_pred_via_filesys: ${scratch.gather_pred_via_filesys}
          maxdets: 100
          pred_file_evaluators:
            - _target_: sam3.eval.coco_eval_offline.CocoEvaluatorOfflineWithPredFileEvaluators
              gt_path: ${paths.dataset_root}/test/_annotations.coco.json
              tide: False
              iou_type: "segm"

  optim:
    amp:
      enabled: True
      amp_dtype: bfloat16

    optimizer:
      _target_: torch.optim.AdamW

    gradient_clip:
      _target_: sam3.train.optim.optimizer.GradientClipper
      max_norm: 0.1
      norm_type: 2

    param_group_modifiers:
      - _target_: sam3.train.optim.optimizer.layer_decay_param_modifier
        _partial_: True
        layer_decay_value: ${scratch.lrd_vision_backbone}
        apply_to: 'backbone.vision_backbone.trunk'
        overrides:
          - pattern: '*pos_embed*'
            value: 1.0

    options:
      lr:
        - scheduler:
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_transformer}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
        - scheduler:
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_vision_backbone}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
          param_names:
            - 'backbone.vision_backbone.*'
        - scheduler:
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_language_backbone}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
          param_names:
            - 'backbone.language_backbone.*'

      weight_decay:
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: ${scratch.wd}
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: 0.0
          param_names:
            - '*bias*'
          module_cls_names: ['torch.nn.LayerNorm']

  checkpoint:
    save_dir: ${launcher.experiment_log_dir}/checkpoints
    save_freq: 0  # No checkpointing during eval

  logging:
    tensorboard_writer:
      _target_: sam3.train.utils.logger.make_tensorboard_logger
      log_dir: ${launcher.experiment_log_dir}/tensorboard
      flush_secs: 120
      should_log: True
    wandb_writer:
      _target_: sam3.train.utils.logger.make_wandb_logger
      project: ${wandb.project}
      entity: ${wandb.entity}
      name: ${wandb.run_name}
      tags: ${wandb.tags}
      notes: ${wandb.notes}
    log_dir: ${launcher.experiment_log_dir}/logs/solar_array_eval
    log_freq: 1

# ============================================================================
# Launcher Configuration
# ============================================================================
launcher:
  num_nodes: 1
  gpus_per_node: 1
  experiment_log_dir: ${paths.experiment_log_dir}
  multiprocessing_context: spawn

# ============================================================================
# Submitit Configuration (not used for SageMaker, kept for compatibility)
# ============================================================================
submitit:
  account: null
  partition: null
  qos: null
  timeout_hour: 24
  use_cluster: False
  cpus_per_task: 10
  port_range: [10000, 65000]
  constraint: null
